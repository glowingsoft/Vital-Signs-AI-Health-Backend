# Deploys the AI backend to the dev EC2 server (vitalsigns-ai-backend, us-west-2).
#
# Runs on every push to the "dev" branch, or by hand: Actions -> Deploy dev -> Run workflow.
#   1. Runs the tests. Nothing is deployed if they fail.
#   2. Copies the code to the server over SSH (the server needs no Git and no GitHub access).
#   3. Writes .env on the server from the ENV_FILE secret.
#   4. Installs Docker and swap memory on the server, only if they are missing.
#   5. Creates the Postgres SSL certificate on the first deploy (/opt/postgres-ssl, for the NestJS backend).
#   6. Builds and starts the containers (the "migrate" container runs the database migrations).
#   7. Checks /health and fails the run if the API, Redis or Postgres is not OK.
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   EC2_HOST     public IP or DNS name of the server
#   EC2_USER     ubuntu
#   EC2_SSH_KEY  full contents of vitalsigns-ai-backend-key.pem
#   ENV_FILE     full contents of the server's .env (see .env.example for the keys). Must include
#                PG_PRIVATE_BIND_IP and NODE_BACKEND_PASSWORD: this step rewrites .env on every deploy.
#
# Nginx is not installed on the server: it runs inside Docker as the "gateway" container.

name: Deploy dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

# Never run two deploys at the same time; a newer push waits for the running one.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_DIR: /opt/vitalsigns-ai
  # Public domain of the API. Its DNS A record must point to the server's Elastic IP.
  DOMAIN: ai.dev.vitals-signs.com

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install packages
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          missing=0
          for name in EC2_HOST EC2_USER EC2_SSH_KEY ENV_FILE; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name is not set"; missing=1; fi
          done
          exit $missing

      - name: Set up SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 15 -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH=ssh -i $HOME/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15" >> "$GITHUB_ENV"

      - name: Prepare the server (Docker, swap, app folder)
        env:
          TARGET: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          $SSH "$TARGET" "sudo bash -s" <<SETUP
          set -euo pipefail

          # Docker Engine + Compose plugin from Docker's official apt repository (only if missing).
          if ! command -v docker >/dev/null 2>&1 || ! docker compose version >/dev/null 2>&1; then
            echo "Installing Docker ..."
            apt-get update -qq
            apt-get install -y -qq ca-certificates curl rsync
            install -m 0755 -d /etc/apt/keyrings
            curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
            chmod a+r /etc/apt/keyrings/docker.asc
            echo "deb [arch=\$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu \$(. /etc/os-release && echo \$VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
            apt-get update -qq
            apt-get install -y -qq docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
            systemctl enable --now docker
          else
            echo "Docker already installed: \$(docker --version)"
          fi

          # rsync is needed to receive the code.
          command -v rsync >/dev/null 2>&1 || { apt-get update -qq && apt-get install -y -qq rsync; }

          # 2 GB swap so the small instance does not run out of memory during builds (only once).
          if ! swapon --show | grep -q /swapfile; then
            echo "Adding 2 GB swap ..."
            fallocate -l 2G /swapfile
            chmod 600 /swapfile
            mkswap /swapfile
            swapon /swapfile
            grep -q '^/swapfile' /etc/fstab || echo '/swapfile none swap sw 0 0' >> /etc/fstab
          fi

          # App folder, owned by the SSH user so rsync can write to it.
          mkdir -p "${APP_DIR}"
          chown "${EC2_USER}:${EC2_USER}" "${APP_DIR}"
          SETUP

      - name: Copy the code to the server
        env:
          TARGET: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
        run: |
          # --delete removes files that were deleted in the repo. Excluded paths (like .env) are never touched.
          rsync -az --delete -e "$SSH" \
            --exclude '.git/' --exclude '.github/' --exclude '.venv/' --exclude '__pycache__/' \
            --exclude '.pytest_cache/' --exclude '.env' --exclude 'failed_enqueue.jsonl*' \
            --exclude 'docs/' --exclude 'asserts/' --exclude 'old_sql/' --exclude '.DS_Store' \
            ./ "$TARGET:${APP_DIR}/"

      - name: Write .env on the server
        env:
          TARGET: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          printf '%s\n' "$ENV_FILE" | $SSH "$TARGET" "umask 077 && cat > ${APP_DIR}/.env"

      - name: Get the HTTPS certificate (first deploy only)
        env:
          TARGET: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
        run: |
          # Later deploys skip this: the certbot container renews the certificate by itself.
          $SSH "$TARGET" "sudo bash -s" <<CERT
          set -euo pipefail
          mkdir -p /opt/letsencrypt /opt/certbot-www
          if [ -f /opt/letsencrypt/live/${DOMAIN}/fullchain.pem ]; then
            echo "Certificate for ${DOMAIN} already exists."
            exit 0
          fi
          echo "No certificate yet: requesting one from Let's Encrypt for ${DOMAIN} ..."
          cd "${APP_DIR}"
          # Let's Encrypt checks the domain on port 80, which the old gateway holds. Stop it for the check.
          docker compose -f docker-compose.yml -f docker-compose.aws.yml stop gateway 2>/dev/null || true
          docker run --rm -p 80:80 -v /opt/letsencrypt:/etc/letsencrypt certbot/certbot:v2.11.0 \
            certonly --standalone -d ${DOMAIN} --agree-tos --non-interactive --register-unsafely-without-email
          CERT

      - name: Create the Postgres SSL certificate (first deploy only)
        env:
          TARGET: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
        run: |
          # Later deploys skip this; replace it by hand with FORCE=yes (see README, Node backend database access).
          $SSH "$TARGET" "sudo bash -s" <<PGSSL
          set -euo pipefail
          cd "${APP_DIR}"
          ip=\$(grep -E '^PG_PRIVATE_BIND_IP=' .env | cut -d= -f2- | tr -d '"' | tr -d "'")
          if [ -z "\$ip" ]; then
            echo "::error::PG_PRIVATE_BIND_IP is missing from the ENV_FILE secret (the server's private IP)."
            exit 1
          fi
          # A wrong IP would make Docker fail to publish the port: check it belongs to this server.
          if ! ip -4 -o addr show | grep -qw "\$ip"; then
            echo "::error::PG_PRIVATE_BIND_IP=\$ip is not an address of this server."
            exit 1
          fi
          if [ -f /opt/postgres-ssl/server.key ]; then
            echo "Postgres SSL certificate already exists."
          else
            bash docker/postgres-ssl.sh "\$ip"
          fi
          PGSSL

      - name: Build and start the containers
        env:
          TARGET: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
        run: |
          $SSH "$TARGET" "bash -s" <<DEPLOY
          set -euo pipefail
          cd "${APP_DIR}"
          COMPOSE="sudo docker compose -f docker-compose.yml -f docker-compose.aws.yml"
          \$COMPOSE config --quiet
          \$COMPOSE up -d --build --remove-orphans
          # Apply a changed docker/postgres/pg_hba.conf (Postgres reads it only at start and on reload).
          \$COMPOSE exec -T postgres psql -U postgres -qAt -c 'SELECT pg_reload_conf()' >/dev/null
          # Remove old images so the 20 GB disk does not fill up.
          sudo docker image prune -f >/dev/null
          \$COMPOSE ps
          DEPLOY

      - name: Health check
        env:
          TARGET: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
        run: |
          $SSH "$TARGET" "DOMAIN=$DOMAIN bash -s" <<'CHECK'
          set -uo pipefail
          for i in $(seq 1 30); do
            # Over HTTPS on the server itself (--resolve skips DNS), so the certificate is checked too.
            body=$(curl -fsS --max-time 5 --resolve "$DOMAIN:443:127.0.0.1" "https://$DOMAIN/health" || true)
            if echo "$body" | grep -q '"redis":"ok"' && echo "$body" | grep -q '"database":"ok"'; then
              echo "Healthy: $body"
              exit 0
            fi
            echo "Waiting for the API ($i/30): ${body:-no answer}"
            sleep 5
          done
          echo "::error::Health check failed. Last answer: ${body:-none}"
          cd /opt/vitalsigns-ai && sudo docker compose -f docker-compose.yml -f docker-compose.aws.yml logs --tail 50
          exit 1
          CHECK

      - name: Check HTTPS from the internet (TLS 1.3 only)
        run: |
          # The real domain through DNS and the security group, like the apps will use it.
          curl -fsS --max-time 10 --tlsv1.3 "https://$DOMAIN/health" && echo
          echo "TLS 1.3: OK"
          # TLS 1.2 must be refused (Spec: TLS 1.3 in transit).
          if curl -sS --max-time 10 --tlsv1.2 --tls-max 1.2 -o /dev/null "https://$DOMAIN/health" 2>/dev/null; then
            echo "::error::$DOMAIN still accepts TLS 1.2"
            exit 1
          fi
          echo "TLS 1.2 refused: OK"
          # Plain HTTP must redirect to HTTPS.
          code=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' "http://$DOMAIN/health")
          [ "$code" = "301" ] || { echo "::error::http://$DOMAIN answered $code, expected 301"; exit 1; }
          echo "HTTP redirects to HTTPS: OK"

      - name: Remove the SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key