# Deploys VERSION v2 of the AI backend (the code in backend/ on the v2_main branch) to the dev EC2 server.
#   /opt/vitalsigns-v2  ->  Compose project "vitalsigns-v2"  ->  https://ai.dev.vitals-signs.com/v2/...
# The gateway and Postgres are NOT deployed here: they are the platform (.github/workflows/platform.yml),
# which must be running first. This version only adds its own code + its own Redis.
#
# Runs on every push to v2_main (except platform-only changes), or by hand: Actions -> Deploy v2 -> Run workflow.
#   1. Runs the tests. Nothing is deployed if they fail.
#   2. Checks that the platform (gateway + Postgres) is running.
#   3. Copies backend/ and this version's compose files to the server.
#   4. Writes .env from the ENV_FILE secret, plus API_VERSION and RUN_MIGRATIONS below.
#   5. Builds and starts the containers ("migrate" runs the database migrations when RUN_MIGRATIONS=true).
#   6. Checks https://ai.dev.vitals-signs.com/v2/health.
#
# A NEW VERSION (e.g. v2 on v2_main): copy this file to v2.yml and change only the values marked "PER VERSION".
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   EC2_HOST     public IP or DNS name of the server
#   EC2_USER     ubuntu
#   EC2_SSH_KEY  full contents of vitalsigns-ai-backend-key.pem
#   ENV_FILE     full contents of the server's .env (see .env.example for the keys)

name: Deploy v2

on:
  push:
    branches: [v2_main_new]                     # PER VERSION
    paths-ignore:
      # Platform-only changes are deployed by platform.yml.
      - "gateway/**"
      - "postgres/**"
      - "docker-compose.platform*.yml"
      - ".github/workflows/platform.yml"
      - "docs/**"
      - "**.md"
  workflow_dispatch:

# One deploy on the server at a time, platform and versions alike (they share the same group).
concurrency:
  group: deploy-server
  cancel-in-progress: false

permissions:
  contents: read

env:
  API_VERSION: v2                           # PER VERSION: the URL prefix /v2 and the container names
  APP_DIR: /opt/vitalsigns-v2               # PER VERSION
  # PER VERSION: "true" only for the NEWEST version. Set it to "false" here when v2 goes live
  # (v2 then runs the migrations on the shared database). See VERSIONS.md.
  RUN_MIGRATIONS: "true"
  # Public domain of the API. Its DNS A record must point to the server's Elastic IP.
  DOMAIN: ai.dev.vitals-signs.com

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install packages
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          missing=0
          for name in EC2_HOST EC2_USER EC2_SSH_KEY ENV_FILE; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name is not set"; missing=1; fi
          done
          exit $missing

      - name: Set up SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 15 -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH=ssh -i $HOME/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15" >> "$GITHUB_ENV"

      - name: Check the platform is running (gateway + Postgres)
        env:
          TARGET: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
        run: |
          $SSH "$TARGET" "sudo bash -s" <<'CHECK'
          set -uo pipefail
          for c in vitalsigns-platform-gateway-1 vitalsigns-platform-postgres-1; do
            if [ "$(docker inspect -f '{{.State.Running}}' "$c" 2>/dev/null)" != "true" ]; then
              echo "::error::$c is not running. Deploy the platform first: Actions -> Deploy platform -> Run workflow, then run this workflow again."
              exit 1
            fi
          done
          echo "Platform is running."
          CHECK

      - name: Prepare the server (swap, app folder)
        env:
          TARGET: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          $SSH "$TARGET" "sudo bash -s" <<SETUP
          set -euo pipefail
          # 2 GB swap so the small instance does not run out of memory during builds (only once).
          if ! swapon --show | grep -q /swapfile; then
            echo "Adding 2 GB swap ..."
            fallocate -l 2G /swapfile
            chmod 600 /swapfile
            mkswap /swapfile
            swapon /swapfile
            grep -q '^/swapfile' /etc/fstab || echo '/swapfile none swap sw 0 0' >> /etc/fstab
          fi
          # App folder, owned by the SSH user so rsync can write to it.
          mkdir -p "${APP_DIR}"
          chown "${EC2_USER}:${EC2_USER}" "${APP_DIR}"
          SETUP

      - name: Copy the code to the server
        env:
          TARGET: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
        run: |
          # Only this version's files: backend/ + its compose files (gateway/ and postgres/ are the platform's).
          mkdir -p deploy
          cp -r backend docker-compose.yml docker-compose.aws.yml deploy/
          # --delete removes files that were deleted in the repo. Excluded paths (like .env) are never touched.
          rsync -az --delete -e "$SSH" \
            --exclude '.env' --exclude '__pycache__/' --exclude '.pytest_cache/' \
            --exclude 'failed_enqueue.jsonl*' --exclude '.DS_Store' \
            deploy/ "$TARGET:${APP_DIR}/"

      - name: Write .env on the server
        env:
          TARGET: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          # The shared secret values, then this version's own settings (later lines win in Compose).
          { printf '%s\n' "$ENV_FILE"; echo "API_VERSION=${API_VERSION}"; echo "RUN_MIGRATIONS=${RUN_MIGRATIONS}"; } \
            | $SSH "$TARGET" "umask 077 && cat > ${APP_DIR}/.env"

      - name: Build and start the containers
        env:
          TARGET: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
        run: |
          $SSH "$TARGET" "bash -s" <<DEPLOY
          set -euo pipefail
          cd "${APP_DIR}"
          COMPOSE="sudo docker compose -f docker-compose.yml -f docker-compose.aws.yml"
          \$COMPOSE config --quiet
          \$COMPOSE up -d --build --remove-orphans
          # Remove old images so the 20 GB disk does not fill up.
          sudo docker image prune -f >/dev/null
          \$COMPOSE ps
          DEPLOY

      - name: Health check
        env:
          TARGET: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
        run: |
          $SSH "$TARGET" "DOMAIN=$DOMAIN API_VERSION=$API_VERSION APP_DIR=$APP_DIR bash -s" <<'CHECK'
          set -uo pipefail
          url="https://$DOMAIN/$API_VERSION/health"
          for i in $(seq 1 30); do
            # Over HTTPS on the server itself (--resolve skips DNS), through the platform's gateway.
            body=$(curl -fsS --max-time 5 --resolve "$DOMAIN:443:127.0.0.1" "$url" || true)
            if echo "$body" | grep -q '"redis":"ok"' && echo "$body" | grep -q '"database":"ok"'; then
              echo "Healthy: $body"
              exit 0
            fi
            echo "Waiting for $url ($i/30): ${body:-no answer}"
            sleep 5
          done
          echo "::error::Health check failed. Last answer: ${body:-none}"
          cd "$APP_DIR" && sudo docker compose -f docker-compose.yml -f docker-compose.aws.yml logs --tail 50
          exit 1
          CHECK

      - name: Check from the internet
        run: |
          # The real domain through DNS and the security group, like the apps will use it.
          curl -fsS --max-time 10 "https://$DOMAIN/$API_VERSION/health" && echo

      - name: Remove the SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
