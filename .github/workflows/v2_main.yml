# Deploys the "v2_main" branch as a SECOND copy of the AI backend on the same dev EC2 server
# (vitalsigns-ai-backend, us-west-2), next to the current version from the "dev" branch.
#
#   current version: /opt/vitalsigns-ai  ->  https://ai.dev.vitals-signs.com/...      (.github/workflows/dev.yml)
#   v2_main:         /opt/v2main         ->  https://ai.dev.vitals-signs.com/v2/...   (this file)
#
# Runs on every push to the "v2_main" branch, or by hand: Actions -> Deploy v2_main -> Run workflow.
#   1. Runs the tests. Nothing is deployed if they fail.
#   2. Copies the code to /opt/v2main over SSH.
#   3. Writes /opt/v2main/.env from the ENV_FILE_V2MAIN secret, or from ENV_FILE when that one is not set.
#   4. Installs Docker and swap memory, and creates the shared Docker network, only if they are missing.
#   5. Checks that the current version's Postgres is on the shared network (the dev deploy puts it there).
#   6. Builds and starts the v2 containers (Compose project "v2main", see docker-compose.v2main.yml).
#   7. Checks the v2 orchestrator's /health inside Docker, then https://ai.dev.vitals-signs.com/v2/health.
#
# Shared with the current version: the Postgres database (same data, same logins), the gateway, the HTTPS
# certificate and the domain. The gateway's /v2 route is in gateway/nginx.aws.conf on the "dev" branch.
# v2 has its own code containers and its own Redis (job queue).
#
# Database migrations: v2 does NOT run "alembic upgrade head". The tables belong to the current version.
# A migration that only exists on v2_main would change the tables the current code uses, and the dev deploy
# would then fail on a revision it does not know. Apply table changes deliberately, from the dev branch.
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   EC2_HOST, EC2_USER, EC2_SSH_KEY   the same ones the dev deploy uses (same server)
#   ENV_FILE_V2MAIN   optional. Full contents of /opt/v2main/.env, when v2 needs different settings
#                     (for example USE_BEDROCK). When it is not set, ENV_FILE (the current version's .env) is used.
#                     DB_NAME, DB_APP_USER and DB_APP_PASSWORD must be the SAME as in ENV_FILE: same database.

name: Deploy v2_main

on:
  push:
    branches: [v2_main]
  workflow_dispatch:

# Never run two v2 deploys at the same time; a newer push waits for the running one.
concurrency:
  group: deploy-v2main
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_DIR: /opt/v2main
  # Compose project name: keeps v2's containers, network and volumes apart from the current version's.
  PROJECT: v2main
  # Shared domain; v2 is served under /v2 by the current version's gateway.
  DOMAIN: ai.dev.vitals-signs.com
  BASE_PATH: /v2
  SHARED_NETWORK: vitalsigns-shared

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install packages
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          ENV_FILE: ${{ secrets.ENV_FILE_V2MAIN || secrets.ENV_FILE }}
        run: |
          missing=0
          for name in EC2_HOST EC2_USER EC2_SSH_KEY ENV_FILE; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name is not set (for ENV_FILE: set ENV_FILE_V2MAIN or ENV_FILE)"; missing=1; fi
          done
          exit $missing

      - name: Set up SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 15 -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH=ssh -i $HOME/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15" >> "$GITHUB_ENV"

      - name: Prepare the server (Docker, swap, shared network, app folder)
        env:
          TARGET: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          $SSH "$TARGET" "sudo bash -s" <<SETUP
          set -euo pipefail

          # Docker Engine + Compose plugin (only if missing; normally the dev deploy already installed it).
          if ! command -v docker >/dev/null 2>&1 || ! docker compose version >/dev/null 2>&1; then
            echo "Installing Docker ..."
            apt-get update -qq
            apt-get install -y -qq ca-certificates curl rsync
            install -m 0755 -d /etc/apt/keyrings
            curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
            chmod a+r /etc/apt/keyrings/docker.asc
            echo "deb [arch=\$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu \$(. /etc/os-release && echo \$VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
            apt-get update -qq
            apt-get install -y -qq docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
            systemctl enable --now docker
          else
            echo "Docker already installed: \$(docker --version)"
          fi

          command -v rsync >/dev/null 2>&1 || { apt-get update -qq && apt-get install -y -qq rsync; }

          # 2 GB swap (only once; shared with the current version).
          if ! swapon --show | grep -q /swapfile; then
            echo "Adding 2 GB swap ..."
            fallocate -l 2G /swapfile
            chmod 600 /swapfile
            mkswap /swapfile
            swapon /swapfile
            grep -q '^/swapfile' /etc/fstab || echo '/swapfile none swap sw 0 0' >> /etc/fstab
          fi

          # The network the current version's gateway uses to reach the v2 orchestrator (only once).
          docker network inspect "${SHARED_NETWORK}" >/dev/null 2>&1 || docker network create "${SHARED_NETWORK}"

          # v2 app folder, owned by the SSH user so rsync can write to it.
          mkdir -p "${APP_DIR}"
          chown "${EC2_USER}:${EC2_USER}" "${APP_DIR}"
          SETUP

      - name: Copy the code to the server
        env:
          TARGET: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
        run: |
          # Only /opt/v2main is touched; /opt/vitalsigns-ai (the current version) is never changed.
          rsync -az --delete -e "$SSH" \
            --exclude '.git/' --exclude '.github/' --exclude '.venv/' --exclude '__pycache__/' \
            --exclude '.pytest_cache/' --exclude '.env' --exclude 'failed_enqueue.jsonl*' \
            --exclude 'docs/' --exclude 'asserts/' --exclude 'old_sql/' --exclude '.DS_Store' \
            ./ "$TARGET:${APP_DIR}/"

      - name: Write .env on the server
        env:
          TARGET: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
          ENV_FILE: ${{ secrets.ENV_FILE_V2MAIN || secrets.ENV_FILE }}
        run: |
          printf '%s\n' "$ENV_FILE" | $SSH "$TARGET" "umask 077 && cat > ${APP_DIR}/.env"

      - name: Check the shared database is reachable
        env:
          TARGET: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
        run: |
          # The dev deploy connects the current Postgres to the shared network as "v1-postgres".
          $SSH "$TARGET" "SHARED_NETWORK=$SHARED_NETWORK bash -s" <<'DBCHECK'
          set -euo pipefail
          aliases=$(sudo docker network inspect "$SHARED_NETWORK" --format '{{range .Containers}}{{.Name}} {{end}}')
          echo "On $SHARED_NETWORK: ${aliases:-nothing}"
          if ! echo "$aliases" | grep -q 'postgres'; then
            echo "::error::The current Postgres is not on the $SHARED_NETWORK network yet. Deploy the dev branch first (with the /v2 gateway change), then run this workflow again."
            exit 1
          fi
          DBCHECK

      - name: Build and start the v2 containers
        env:
          TARGET: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
        run: |
          $SSH "$TARGET" "bash -s" <<DEPLOY
          set -euo pipefail
          cd "${APP_DIR}"
          # "-p v2main": --remove-orphans and everything else only affect v2's containers.
          COMPOSE="sudo docker compose -p ${PROJECT} -f docker-compose.yml -f docker-compose.v2main.yml"
          \$COMPOSE config --quiet
          \$COMPOSE up -d --build --remove-orphans
          # Removes only unused (dangling) images; the current version's image is in use and stays.
          sudo docker image prune -f >/dev/null
          \$COMPOSE ps
          DEPLOY

      - name: Health check (inside Docker)
        env:
          TARGET: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
        run: |
          $SSH "$TARGET" "APP_DIR=$APP_DIR PROJECT=$PROJECT bash -s" <<'CHECK'
          set -uo pipefail
          cd "$APP_DIR"
          COMPOSE="sudo docker compose -p $PROJECT -f docker-compose.yml -f docker-compose.v2main.yml"
          for i in $(seq 1 30); do
            # v2 has no gateway: ask its orchestrator directly.
            body=$($COMPOSE exec -T orchestrator python -c "import urllib.request; print(urllib.request.urlopen('http://localhost:8000/health', timeout=5).read().decode())" 2>/dev/null || true)
            if echo "$body" | grep -q '"redis":"ok"' && echo "$body" | grep -q '"database":"ok"'; then
              echo "Healthy: $body"
              exit 0
            fi
            echo "Waiting for the v2 API ($i/30): ${body:-no answer}"
            sleep 5
          done
          echo "::error::v2 health check failed. Last answer: ${body:-none}"
          $COMPOSE logs --tail 50
          exit 1
          CHECK

      - name: Check https://ai.dev.vitals-signs.com/v2/health from the internet
        run: |
          # Goes through the current version's gateway. Until the /v2 route is deployed from the "dev" branch,
          # this only warns: v2 itself is already running (checked above).
          body=$(curl -fsS --max-time 10 --tlsv1.3 "https://${DOMAIN}${BASE_PATH}/health" || true)
          if echo "$body" | grep -q '"database":"ok"'; then
            echo "Public v2 health: $body"
          else
            echo "::warning::https://${DOMAIN}${BASE_PATH}/health did not answer OK (${body:-no answer}). Is the /v2 route in gateway/nginx.aws.conf deployed from the dev branch?"
          fi

      - name: Remove the SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key