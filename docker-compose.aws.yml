# ONE VERSION on the server (EC2), merged on top of docker-compose.yml. Used only by the deploy workflow:
#   docker compose -f docker-compose.yml -f docker-compose.aws.yml up -d --build
# On your Mac, keep using plain "docker compose up": nothing here changes the local setup.
#
# What changes on the server:
# - Redis publishes no ports at all. Only this version's containers can reach it.
# The gateway (HTTPS) and Postgres are the platform's: docker-compose.platform.aws.yml.
# "!reset" removes the list from docker-compose.yml (Docker Compose 2.24.4+).

services:
  redis:
    ports: !reset []
