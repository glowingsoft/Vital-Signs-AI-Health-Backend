# PLATFORM on the server (EC2), merged on top of docker-compose.platform.yml. Used only by the deploy workflow:
#   docker compose -f docker-compose.platform.yml -f docker-compose.platform.aws.yml up -d
# (.github/workflows/platform.yml). On your Mac keep using docker-compose.platform.yml alone.
#
# What changes on the server:
# - The gateway serves HTTPS (TLS 1.3) for ai.dev.vitals-signs.com on port 443, with gateway/nginx.aws.conf.
#   Port 80 only redirects to HTTPS and answers the Let's Encrypt renewal check.
# - A "certbot" container renews the Let's Encrypt certificate. The first certificate is fetched by
#   the deploy workflow ("Get the HTTPS certificate" step) before the gateway starts.
# - Postgres publishes no ports at all. Only containers on the shared network can reach it.
# "!override" replaces the list from docker-compose.platform.yml, "!reset" removes it (Docker Compose 2.24.4+).
#
# Certificate files live on the server, outside the app folders (rsync --delete never touches them):
#   /opt/letsencrypt   certificates and renewal settings
#   /opt/certbot-www   temporary files for the renewal check

services:
  gateway:
    ports: !override
      - "80:80"
      - "443:443"
    volumes: !override
      - ./gateway/nginx.aws.conf:/etc/nginx/conf.d/default.conf:ro
      - ./gateway/default-version.conf:/etc/nginx/vitalsigns/default-version.conf:ro
      - ./gateway/src:/usr/share/nginx/errors:ro
      - /opt/letsencrypt:/etc/letsencrypt:ro
      - /opt/certbot-www:/var/www/certbot:ro
    # Reload nginx every 12 hours so a renewed certificate is picked up without a restart.
    command: ["/bin/sh", "-c", "while :; do sleep 12h; nginx -s reload; done & exec nginx -g 'daemon off;'"]

  certbot:
    image: certbot/certbot:v2.11.0
    restart: unless-stopped
    volumes:
      - /opt/letsencrypt:/etc/letsencrypt
      - /opt/certbot-www:/var/www/certbot
    # Tries to renew twice a day; certbot only renews when the certificate has less than 30 days left.
    # "$$" = a literal "$" for the shell (Compose would otherwise read it as a variable).
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]
    networks: [shared]

  postgres:
    ports: !reset []
