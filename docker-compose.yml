# The whole local stack in Docker: gateway + orchestrator + 3 motors + worker + Postgres + Redis.
# Before the API and worker start, the one-off "migrate" container runs "alembic upgrade head".
# Start: docker compose up --build    Values (DB_NAME, passwords, ...) come from .env in this folder.
#
# Ports on your Mac: gateway 80 (the only way into the API), Postgres 5433, Redis 6380.
# Postgres and Redis use different ports from the brew versions (5432 / 6379), so both setups can run
# side by side. Their data is separate. The orchestrator and motors have no published port.

# Settings shared by every container built from our image ("x-" blocks are reusable pieces).
x-app: &app
  build: .
  image: vitalsigns-ai
  restart: unless-stopped
  volumes:
    - fallback:/data  # failed_enqueue.jsonl lives here, shared by the API and the worker
  depends_on:
    migrate:
      condition: service_completed_successfully  # the database schema is up to date
    redis:
      condition: service_healthy

# Environment shared by every container built from our image.
# Inside Docker, containers reach each other by service name ("postgres", "redis"), not localhost.
x-app-env: &app-env
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: ${DB_NAME}
  DB_APP_USER: ${DB_APP_USER}
  DB_APP_PASSWORD: ${DB_APP_PASSWORD}
  REDIS_URL: redis://redis:6379/0
  MAX_JOB_ATTEMPTS: ${MAX_JOB_ATTEMPTS:-5}
  FAILED_ENQUEUE_FILE: /data/failed_enqueue.jsonl
  # Same secret the NestJS backend signs access tokens with. main.py loads every router, so every API
  # container imports python_auth and refuses to start without it. ":?" = compose stops with this message.
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env (the NestJS token secret)}

# Health check for every API container (orchestrator and motors all have GET /health).
x-api-healthcheck: &api-healthcheck
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
  interval: 10s
  timeout: 3s
  retries: 5

services:
  # ---------- Gateway: the only entry point from outside ----------
  # Routes /ai/* and /health to the orchestrator, 404 for everything else, rate limit per IP.

  gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./gateway/src:/usr/share/nginx/errors:ro  # custom 404 pages (HTML for browsers, JSON for apps)
    ports:
      - "127.0.0.1:80:80"  # 127.0.0.1 = reachable only from your Mac, not your network
    depends_on:
      orchestrator:
        condition: service_healthy

  # ---------- API: same image, one part per container ----------
  # "expose" = reachable by other containers on Docker's network, never from your Mac.

  orchestrator:
    <<: *app
    environment:
      <<: *app-env
      SERVICE: orchestrator
      # The motors' addresses on Docker's network (service name + container port).
      TRIAGE_URL: http://triage:8000
      VISUAL_URL: http://visual:8000
      VITALS_URL: http://vitals:8000
    expose:
      - "8000"
    healthcheck: *api-healthcheck

  triage:
    <<: *app
    environment:
      <<: *app-env
      SERVICE: triage
    expose:
      - "8000"
    healthcheck: *api-healthcheck

  visual:
    <<: *app
    environment:
      <<: *app-env
      SERVICE: visual
    expose:
      - "8000"
    healthcheck: *api-healthcheck

  vitals:
    <<: *app
    environment:
      <<: *app-env
      SERVICE: vitals
    expose:
      - "8000"
    healthcheck: *api-healthcheck

  # Runs "alembic upgrade head" once and exits. Every other app container waits for it to succeed.
  migrate:
    image: vitalsigns-ai
    build: .
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment:
      <<: *app-env
      DB_NODE_USER: ${DB_NODE_USER}  # the first migration grants the Node login read access
    depends_on:
      postgres:
        condition: service_healthy  # wait until Postgres is set up and accepting connections

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *app-env
    stop_grace_period: 15s  # time to finish the current job after "docker compose stop" (SIGTERM)

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      # Admin password. Set DB_ADMIN_PASSWORD in .env to use a separate one; otherwise the app password is reused.
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:-${DB_APP_PASSWORD}}
      # Read by docker/postgres-init.sh on the first start.
      DB_NAME: ${DB_NAME}
      DB_APP_USER: ${DB_APP_USER}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      DB_NODE_USER: ${DB_NODE_USER}
      DB_NODE_PASSWORD: ${DB_NODE_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data  # the database files; kept when containers are removed
      - ./db/bootstrap.sql:/sql/bootstrap.sql:ro
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/init.sh:ro  # runs only on an empty volume
    ports:
      - "127.0.0.1:5433:5432"  # TablePlus: localhost, port 5433
    healthcheck:
      # -h 127.0.0.1 = check over TCP. During first-time setup Postgres only listens on a local socket,
      # so this stays "unhealthy" until the init script has finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d $${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]  # persistence: queued jobs survive a restart
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6380:6379"  # redis-cli -p 6380
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

# Named volumes = storage managed by Docker that survives "docker compose down".
# "docker compose down -v" deletes them (all Docker database and queue data).
volumes:
  pgdata:
  redisdata:
  fallback:
