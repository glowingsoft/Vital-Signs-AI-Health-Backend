# ONE VERSION of the AI backend: orchestrator + 3 motors + worker + migrate + its own Redis.
# The code comes from backend/. The gateway and Postgres are NOT here: they belong to the platform
# (docker-compose.platform.yml), which every version shares. Start the platform first.
#
# Local start, from the repo root:
#   docker network create vitalsigns-shared          # once
#   docker compose -f docker-compose.platform.yml up -d
#   docker compose up -d --build
# Then http://localhost/v1/health (and /health while v1 is the default version).
# On the server: .github/workflows/v1.yml (adds docker-compose.aws.yml).
#
# API_VERSION (v1, v2, ...) names everything that must be unique per version on the shared network:
#   - the Compose project "vitalsigns-v1" (its containers, its Redis data)
#   - the name the gateway uses: "v1-orchestrator"  ->  https://.../v1/...
#   - the names this version's containers use for each other: "v1-triage", "v1-redis", ...
# Plain names like "triage" or "redis" are NOT used between containers: on the shared network another
# version's "triage" would answer to the same name.
#
# A NEW VERSION (v2_main branch): set API_VERSION=v2 (workflow + .env). Nothing else changes here.
#
# RUN_MIGRATIONS: only the NEWEST version runs "alembic upgrade head" on the shared database.
#   Older versions that are still running set RUN_MIGRATIONS=false. See VERSIONS.md.
#
# Values (DB_NAME, passwords, ...) come from .env in this folder.

name: vitalsigns-${API_VERSION:-v1}

# Settings shared by every container built from our image ("x-" blocks are reusable pieces).
x-app: &app
  build: ./backend
  image: vitalsigns-ai-${API_VERSION:-v1}
  restart: unless-stopped
  volumes:
    - fallback:/data  # failed_enqueue.jsonl lives here, shared by the API and the worker
  depends_on:
    migrate:
      condition: service_completed_successfully  # the database schema is up to date
    redis:
      condition: service_healthy

# Environment shared by every container built from our image.
x-app-env: &app-env
  API_VERSION: ${API_VERSION:-v1}
  # The platform's Postgres, over the shared network. The same database for every version.
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: ${DB_NAME}
  DB_APP_USER: ${DB_APP_USER}
  DB_APP_PASSWORD: ${DB_APP_PASSWORD}
  # This version's own Redis (its job queue).
  REDIS_URL: redis://${API_VERSION:-v1}-redis:6379/0
  MAX_JOB_ATTEMPTS: ${MAX_JOB_ATTEMPTS:-5}
  FAILED_ENQUEUE_FILE: /data/failed_enqueue.jsonl
  # Same secret the NestJS backend signs access tokens with. main.py loads every router, so every API
  # container imports python_auth and refuses to start without it. ":?" = compose stops with this message.
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env (the NestJS token secret)}
  # AI models. Off by default: the motors answer with their stub rules and nothing calls AWS.
  # AWS credentials are never set here: on EC2 they come from the instance's IAM role.
  USE_BEDROCK: ${USE_BEDROCK:-false}
  AWS_REGION: ${AWS_REGION:-us-west-2}

# Health check for every API container (orchestrator and motors all have GET /health).
x-api-healthcheck: &api-healthcheck
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
  interval: 10s
  timeout: 3s
  retries: 5

services:
  # ---------- API: same image, one part per container ----------
  # "expose" = reachable by other containers on Docker's networks, never from your Mac.

  orchestrator:
    <<: *app
    environment:
      <<: *app-env
      SERVICE: orchestrator
      # This version's motors (versioned names, see the top of this file).
      TRIAGE_URL: http://${API_VERSION:-v1}-triage:8000
      VISUAL_URL: http://${API_VERSION:-v1}-visual:8000
      VITALS_URL: http://${API_VERSION:-v1}-vitals:8000
    expose:
      - "8000"
    healthcheck: *api-healthcheck
    networks:
      default:
      shared:
        aliases: ["${API_VERSION:-v1}-orchestrator"]  # the gateway sends /v1/... here

  triage:
    <<: *app
    environment:
      <<: *app-env
      SERVICE: triage
    expose:
      - "8000"
    healthcheck: *api-healthcheck
    networks:
      default:
        aliases: ["${API_VERSION:-v1}-triage"]
      shared:

  visual:
    <<: *app
    environment:
      <<: *app-env
      SERVICE: visual
    expose:
      - "8000"
    healthcheck: *api-healthcheck
    networks:
      default:
        aliases: ["${API_VERSION:-v1}-visual"]
      shared:

  vitals:
    <<: *app
    environment:
      <<: *app-env
      SERVICE: vitals
    expose:
      - "8000"
    healthcheck: *api-healthcheck
    networks:
      default:
        aliases: ["${API_VERSION:-v1}-vitals"]
      shared:

  # Runs once and exits; every other app container waits for it to succeed.
  # Waits for the platform's Postgres, then runs "alembic upgrade head" only when RUN_MIGRATIONS=true
  # (backend/migrate.sh). With RUN_MIGRATIONS=false it exits at once: this version uses the schema as it is.
  migrate:
    image: vitalsigns-ai-${API_VERSION:-v1}
    build: ./backend
    command: ["sh", "migrate.sh"]
    restart: "no"
    environment:
      <<: *app-env
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      DB_NODE_USER: ${DB_NODE_USER}  # the first migration grants the Node login read access
    networks: [default, shared]

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *app-env
    stop_grace_period: 15s  # time to finish the current job after "docker compose stop" (SIGTERM)
    networks: [default, shared]

  # This version's own Redis. Only on this version's network: no other version can see it.
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]  # persistence: queued jobs survive a restart
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"  # redis-cli -p 6380 (REDIS_PORT: another port for a 2nd version)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      default:
        aliases: ["${API_VERSION:-v1}-redis"]

networks:
  # default = this version's private network (code + Redis), created by Compose per project.
  # shared  = the platform's network: gateway + Postgres + every version's containers.
  shared:
    external: true
    name: vitalsigns-shared

# Named volumes = storage managed by Docker that survives "docker compose down".
# They belong to this version's project (e.g. vitalsigns-v1_redisdata).
volumes:
  redisdata:
  fallback:
