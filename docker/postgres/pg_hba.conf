# Who may connect to Postgres on the server, and how. The first matching line wins.
# Used only on the server: docker-compose.aws.yml mounts this folder and starts Postgres with hba_file=...
# (the local docker-compose.yml keeps the image's default rules).
# After changing it, reload Postgres (the deploy workflow does): SELECT pg_reload_conf()
#
# TYPE   DATABASE  USER          ADDRESS        METHOD

# Inside the postgres container: first-start init script, "docker compose exec postgres psql",
# and the pg_isready health check. Same as the image's defaults.
local    all       all                          trust
host     all       all           127.0.0.1/32   trust
host     all       all           ::1/128        trust

# The NestJS backend over the private AWS network: SSL required, and only the node_backend login.
hostssl  all       node_backend  0.0.0.0/0      scram-sha-256
hostssl  all       node_backend  ::/0           scram-sha-256
# node_backend without SSL: refused from every address. Explicit, because when Docker proxies a published port
# the client appears to come from the Docker network's gateway, which "samenet" below would otherwise accept.
host     all       node_backend  all            reject

# The AI containers (orchestrator, worker, migrate) on the Docker network. "samenet" = the subnets of
# the container's own network interfaces, i.e. the compose network. No SSL needed inside Docker.
host     all       all           samenet        scram-sha-256

# Everything else is refused: any other login from outside, and node_backend without SSL.
host     all       all           0.0.0.0/0      reject
host     all       all           ::/0           reject
