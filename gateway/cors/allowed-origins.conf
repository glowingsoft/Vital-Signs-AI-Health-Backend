# Which browser origins may call the API through the gateway (CORS). One line per origin, inside nginx's
# "map $http_origin $cors_origin" (gateway/cors/cors-map.conf). Each line: <origin or ~regex>  $http_origin;
# An origin that is not listed gets no CORS headers, so the browser blocks the call (apps and curl are not affected).
#
# After a change: local  -> docker compose -f docker-compose.platform.yml restart gateway
#                 server -> Actions -> Deploy platform -> Run workflow

# Any port on this computer: a frontend on http://localhost:3000, :5173, :8080 ... (local Docker and dev builds).
# Remove these two lines on a production server if no one should call it from a local frontend.
"~^https?://(localhost|127\.0\.0\.1|\[::1\])(:[0-9]{1,5})?$"   $http_origin;
"~^https?://[a-z0-9-]+\.localhost(:[0-9]{1,5})?$"              $http_origin;

# The deployed frontends: add each one (exact scheme + host, no trailing slash), for example
# "https://admin.dev.vitals-signs.com"                          $http_origin;

# ALLOW EVERY ORIGIN: any website may call the API from a browser (the origin is echoed back, so
# credentials work too). The lines above are then not needed. To limit it again, delete this line.
"~.+"                                                           $http_origin;
