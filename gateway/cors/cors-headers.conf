# CORS for the gateway, part 2 of 2: included in each location that may be called from a browser
# (/health, /ai/, /vN/..., and /api/ for the local Node backend). Everything else stays without CORS.
#
# The gateway answers CORS itself, for every version behind it:
#   - the backend's own CORS headers are dropped, so the browser never sees them twice
#   - "always" also puts them on errors made by nginx (429 rate limit, 502 version not running, 504),
#     so the frontend sees the real status instead of a misleading "CORS error"
#   - the preflight (OPTIONS) is answered here with 204 and never reaches the backend

proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Credentials;
proxy_hide_header Access-Control-Allow-Methods;
proxy_hide_header Access-Control-Allow-Headers;
proxy_hide_header Access-Control-Expose-Headers;
proxy_hide_header Access-Control-Max-Age;
proxy_hide_header Vary;

add_header Access-Control-Allow-Origin      $cors_origin always;
add_header Access-Control-Allow-Credentials $cors_allow_credentials always;
add_header Access-Control-Allow-Methods     $cors_allow_methods always;
add_header Access-Control-Allow-Headers     $cors_allow_headers always;
add_header Access-Control-Expose-Headers    $cors_expose_headers always;
add_header Access-Control-Max-Age           $cors_max_age always;
add_header Vary                             Origin always;
add_header X-Request-Id                     $request_id always;

if ($request_method = OPTIONS) {
    return 204;
}
