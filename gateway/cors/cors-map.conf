# CORS for the gateway, part 1 of 2: included once at http level (top of nginx.conf / nginx.aws.conf).
# $cors_origin = the caller's Origin when it is allowed (gateway/cors/allowed-origins.conf), otherwise empty.
# nginx does not send a header whose value is empty, so a disallowed origin simply gets no CORS headers.

map $http_origin $cors_origin {
    default "";
    include /etc/nginx/vitalsigns/cors/allowed-origins.conf;
}

map $cors_origin $cors_allow_credentials {
    ""      "";
    default "true";
}

map $cors_origin $cors_allow_methods {
    ""      "";
    default "GET, POST, PUT, PATCH, DELETE, OPTIONS";
}

map $cors_origin $cors_allow_headers {
    ""      "";
    default "Authorization, Content-Type, Accept, Accept-Language, X-Requested-With, X-Request-Id, X-App-Version";
}

map $cors_origin $cors_expose_headers {
    ""      "";
    default "X-Request-Id, Retry-After";
}

# How long the browser may cache a preflight answer (seconds).
map $cors_origin $cors_max_age {
    ""      "";
    default "600";
}
