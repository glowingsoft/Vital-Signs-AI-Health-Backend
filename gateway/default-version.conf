# Which version answers the URLs WITHOUT a version in front: /health, /ai/...
# (/v1/..., /v2/..., /v3/... always go to that exact version.)
#
# To move the default to a newer version (e.g. before switching v1 off):
#   1. change v1 below to v2
#   2. deploy the platform (Actions -> Deploy platform -> Run workflow)
#
# Included inside the server block of nginx.conf and nginx.aws.conf.
set $default_version v1;
