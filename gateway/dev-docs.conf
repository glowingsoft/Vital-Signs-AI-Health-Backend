# Development only: makes Swagger (/docs) reachable through the gateway.
# Loaded only by docker-compose.platform.dev.yml (mounted into /etc/nginx/dev/); the normal setup returns 404 here.
# Shows the Swagger page of the default version (gateway/default-version.conf).
# Swagger needs both paths: /docs is the page, /openapi.json is the list of endpoints it reads.

location = /docs {
    proxy_pass $orchestrator;
}

location = /openapi.json {
    proxy_pass $orchestrator;
}
