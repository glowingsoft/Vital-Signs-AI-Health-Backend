# API gateway on the server (EC2), with HTTPS. Used only by docker-compose.platform.aws.yml.
# Part of the PLATFORM: one gateway for every version of the backend (routes: see gateway/nginx.conf).
# Local Docker keeps using gateway/nginx.conf (plain HTTP on 127.0.0.1, no certificate needed).
#
# - Port 443: TLS 1.3 only (Proposal M1 §13, Spec: "TLS 1.3 in transit"). Same routes as nginx.conf.
# - Port 80: only the Let's Encrypt renewal check; every other request is redirected to HTTPS.
# The certificate comes from Let's Encrypt and is renewed by the "certbot" container
# (see docker-compose.platform.aws.yml and the "Get the HTTPS certificate" step in .github/workflows/platform.yml).

resolver 127.0.0.11 valid=10s ipv6=off;

# CORS: which browser origins may call /health, /ai/ and /vN/ (gateway/cors/). The headers themselves are added
# by "include /etc/nginx/vitalsigns/cors/cors-headers.conf" in each of those locations.
include /etc/nginx/vitalsigns/cors/cors-map.conf;

limit_req_zone $binary_remote_addr zone=per_ip:10m rate=10r/s;

map $http_accept $not_found_page {
    default        /errors/404.json;
    "~*text/html"  /errors/404.html;
}

# ---------- Port 80: certificate renewal + redirect to HTTPS ----------
server {
    listen 80;
    server_name _;
    server_tokens off;

    # Let's Encrypt checks http://ai.dev.vitals-signs.com/.well-known/acme-challenge/<token> when renewing.
    # The certbot container writes the token file into /var/www/certbot.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://ai.dev.vitals-signs.com$request_uri;
    }
}

# ---------- Port 443: the API over TLS 1.3 ----------
server {
    listen 443 ssl;
    http2 on;
    server_name ai.dev.vitals-signs.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/ai.dev.vitals-signs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.dev.vitals-signs.com/privkey.pem;

    # TLS 1.3 only. TLS 1.2 and older are refused. (Supported by iOS 12.2+ and Android 10+.)
    ssl_protocols TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Tell clients to use HTTPS only for this domain for the next year.
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 10m;

    limit_req zone=per_ip burst=20 nodelay;
    limit_req_status 429;

    # URLs without a version (/health, /ai/...) go to the default version: gateway/default-version.conf.
    # "<version>-orchestrator", not "orchestrator": on the shared network "vitalsigns-shared" every
    # version's orchestrator answers to "orchestrator", so only the versioned name is unique.
    include /etc/nginx/vitalsigns/default-version.conf;
    set $orchestrator http://${default_version}-orchestrator:8000;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 2s;
    proxy_read_timeout    5s;

    location = /health {
        include /etc/nginx/vitalsigns/cors/cors-headers.conf;
        add_header Strict-Transport-Security "max-age=31536000" always;  # location add_header replaces the server one
        proxy_pass $orchestrator;
    }

    location /ai/ {
        include /etc/nginx/vitalsigns/cors/cors-headers.conf;
        add_header Strict-Transport-Security "max-age=31536000" always;  # location add_header replaces the server one
        proxy_pass $orchestrator;
    }

    # Other versions of the backend on this server (v2_main -> /opt/v2main, later v3 ...), one rule for all:
    #   /v2/health  -> container "v2-orchestrator", path /health
    #   /v3/ai/...  -> container "v3-orchestrator", path /ai/...
    # Each version's orchestrator joins the shared network with the alias "<version>-orchestrator"
    # (see docker-compose.yml). A new version needs no change here.
    # Names are looked up per request, so this gateway still starts when a version is not running;
    # a version that is not running (or does not exist) answers 502.
    location ~ ^/(?<api_version>v[0-9]+)(/health|/ai/.*)$ {
        include /etc/nginx/vitalsigns/cors/cors-headers.conf;
        add_header Strict-Transport-Security "max-age=31536000" always;  # location add_header replaces the server one
        rewrite ^/v[0-9]+(/.*)$ $1 break;
        proxy_pass http://$api_version-orchestrator:8000;
    }

    # Everything else, including /motor/*, /docs and /openapi.json.
    location / {
        return 404;
    }

    error_page 404 $not_found_page;

    location ^~ /errors/ {
        internal;
        root /usr/share/nginx;
        ssi on;
        ssi_types application/json;
        # add_header here replaces the server-level ones, so HSTS is repeated.
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}
