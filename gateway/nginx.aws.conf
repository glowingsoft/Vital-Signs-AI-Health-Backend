# API gateway on the server (EC2), with HTTPS. Used only by docker-compose.aws.yml.
# Local Docker keeps using gateway/nginx.conf (plain HTTP on 127.0.0.1, no certificate needed).
#
# - Port 443: TLS 1.3 only (Proposal M1 §13, Spec: "TLS 1.3 in transit"). Same routes as nginx.conf.
# - Port 80: only the Let's Encrypt renewal check; every other request is redirected to HTTPS.
# The certificate comes from Let's Encrypt and is renewed by the "certbot" container
# (see docker-compose.aws.yml and the "Get the HTTPS certificate" step in .github/workflows/dev.yml).

resolver 127.0.0.11 valid=10s ipv6=off;

limit_req_zone $binary_remote_addr zone=per_ip:10m rate=10r/s;

map $http_accept $not_found_page {
    default        /errors/404.json;
    "~*text/html"  /errors/404.html;
}

# ---------- Port 80: certificate renewal + redirect to HTTPS ----------
server {
    listen 80;
    server_name _;
    server_tokens off;

    # Let's Encrypt checks http://vitals-signs.com/.well-known/acme-challenge/<token> when renewing.
    # The certbot container writes the token file into /var/www/certbot.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://vitals-signs.com$request_uri;
    }
}

# ---------- Port 443: the API over TLS 1.3 ----------
server {
    listen 443 ssl;
    http2 on;
    server_name vitals-signs.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/vitals-signs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vitals-signs.com/privkey.pem;

    # TLS 1.3 only. TLS 1.2 and older are refused. (Supported by iOS 12.2+ and Android 10+.)
    ssl_protocols TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Tell clients to use HTTPS only for this domain for the next year.
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 10m;

    limit_req zone=per_ip burst=20 nodelay;
    limit_req_status 429;

    set $orchestrator http://orchestrator:8000;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 2s;
    proxy_read_timeout    5s;

    location = /health {
        proxy_pass $orchestrator;
    }

    location /ai/ {
        proxy_pass $orchestrator;
    }

    # Everything else, including /motor/*, /docs and /openapi.json.
    location / {
        return 404;
    }

    error_page 404 $not_found_page;

    location ^~ /errors/ {
        internal;
        root /usr/share/nginx;
        ssi on;
        ssi_types application/json;
        # add_header here replaces the server-level ones, so HSTS is repeated.
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}
