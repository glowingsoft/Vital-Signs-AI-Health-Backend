# API gateway (local, plain HTTP): the only way into the AI service from outside Docker.
# Part of the PLATFORM (docker-compose.platform.yml): one gateway for every version of the backend.
# Mounted as /etc/nginx/conf.d/default.conf, so everything here sits inside nginx's "http" block.
# Only /ai/* and /health reach an orchestrator; the motors (/motor/*) are never reachable from outside.
#
#   /v1/health, /v1/ai/...  -> container "v1-orchestrator", path /health, /ai/...
#   /v2/health, /v2/ai/...  -> container "v2-orchestrator"   (and so on for v3, v4 ...)
#   /health, /ai/...        -> the default version (gateway/default-version.conf)
# Each version's orchestrator joins the shared network "vitalsigns-shared" as "<version>-orchestrator"
# (see docker-compose.yml). A new version needs no change here; one that is not running answers 502.

# Docker's internal DNS. With a variable in proxy_pass, nginx looks up the name again every 10 s
# instead of once at startup, so it keeps working after an orchestrator restarts with a new IP,
# and the gateway still starts when a version is not running.
resolver 127.0.0.11 valid=10s ipv6=off;

# Rate limit per client IP: 10 requests/second. 10m of memory holds about 160,000 IPs.
limit_req_zone $binary_remote_addr zone=per_ip:10m rate=10r/s;

# Which 404 page to send: browsers ask for text/html and get the designed page,
# apps and curl get JSON in the same shape as FastAPI's own errors ({"detail": ...}).
map $http_accept $not_found_page {
    default        /errors/404.json;
    "~*text/html"  /errors/404.html;
}

server {
    listen 80;
    server_name _;

    # Do not show the nginx version in headers and error pages.
    server_tokens off;

    # Image uploads travel in the request body.
    client_max_body_size 10m;

    # Up to 20 requests above the rate are let through at once (burst); anything more gets 429.
    limit_req zone=per_ip burst=20 nodelay;
    limit_req_status 429;

    # $default_version (e.g. v1) comes from gateway/default-version.conf.
    include /etc/nginx/vitalsigns/default-version.conf;
    set $orchestrator http://${default_version}-orchestrator:8000;

    # Tell the orchestrator who the real client is (it only sees the gateway's IP otherwise).
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The orchestrator gives the motors 2.5 s (MOTOR_TIMEOUT_SECONDS), then queues the result and answers.
    # 5 s leaves room for that, so the orchestrator always answers before nginx gives up.
    proxy_connect_timeout 2s;
    proxy_read_timeout    5s;

    location = /health {
        proxy_pass $orchestrator;
    }

    location /ai/ {
        # The orchestrator verifies the NestJS access token itself (python_auth/); nginx passes the
        # Authorization header through unchanged. Optional extra check at the gateway later, e.g.
        #   auth_request /_auth;
        # plus an internal "location = /_auth" that sends the Authorization header to the token checker.
        proxy_pass $orchestrator;
    }

    # One rule for every version: /v2/ai/... -> "v2-orchestrator", path /ai/... (the /v2 is removed).
    location ~ ^/(?<api_version>v[0-9]+)(/health|/ai/.*)$ {
        rewrite ^/v[0-9]+(/.*)$ $1 break;
        proxy_pass http://$api_version-orchestrator:8000;
    }

    # Extra routes for development (Swagger /docs), mounted only by docker-compose.dev.yml.
    # In the normal setup the folder is empty, so nothing is added.
    include /etc/nginx/dev/*.conf;

    # Everything else, including /motor/*, /docs and /openapi.json.
    location / {
        return 404;
    }

    # Custom 404 pages from gateway/src (mounted at /usr/share/nginx/errors).
    error_page 404 $not_found_page;

    # "internal" = only nginx can use these files (for error_page), never a direct request.
    # SSI fills in the <!--# echo --> tags (requested path, request id) when the page is sent.
    location ^~ /errors/ {
        internal;
        root /usr/share/nginx;
        ssi on;
        ssi_types application/json;
        add_header Cache-Control "no-store" always;
    }
}
